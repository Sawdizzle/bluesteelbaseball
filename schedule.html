<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060910" />
  <title>Schedule &amp; Results — Blue Steel Baseball</title>
  <meta name="description" content="Game schedule, scores, and results for Blue Steel Baseball's 10U and 14U teams." />
  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=tanker@400&f[]=supreme@400,500,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="announcement" class="announcement" role="status" hidden></div>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/" aria-label="Blue Steel Baseball home">
        <span class="brand-mark"><img src="/assets/logo.webp" alt="" width="80" height="80" /></span>
        <span class="brand-text"><strong>Blue Steel</strong><span>Baseball · Sanger TX</span></span>
      </a>
      <nav class="nav" aria-label="Primary">
        <button class="menu-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="nav-links" id="nav-links">
          <a href="/">Home</a>
          <a href="/schedule">Schedule</a>
          <a href="/watch">Watch</a>
          <a href="/gallery">Gallery</a>
          <a href="/contact">Contact</a>
        </div>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="section">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow">Season</span>
          <h2>Schedule &amp; results</h2>
          <p>All times Central. Scores go up right after the final out.</p>
        </div>
        <div class="team-tabs" role="tablist" aria-label="Team" id="team-tabs"></div>

        <div id="schedule-body">
          <p class="empty">Loading the schedule…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <div class="brand">
        <span class="brand-mark"><img src="/assets/logo.webp" alt="" width="80" height="80" /></span>
        <span class="brand-text"><strong>Blue Steel</strong><span>Baseball · Sanger TX</span></span>
      </div>
      <p>Built like steel · Play with purpose</p>
      <a class="admin-link" href="/admin">Team admin</a>
    </div>
  </footer>

  <script type="module">
    import { mountNav, mountAnnouncement, getTeams, getAllGames, fmtDate, fmtTime, resultOf, esc, unavailable } from '/js/data.js';

    mountNav();
    mountAnnouncement();

    const tabs = document.getElementById('team-tabs');
    const body = document.getElementById('schedule-body');
    let games = [];
    let teams = [];
    let current = 'all';

    function rowHTML(g) {
      let score;
      if (g.status === 'final' && g.our_score != null) {
        const r = resultOf(g);
        score = `<span class="tag ${r}">${r}</span>${g.our_score}–${g.their_score}`;
      } else if (g.status === 'live') {
        score = `<span class="live">● LIVE</span>`;
      } else if (g.status === 'cancelled') {
        score = `<span class="upcoming">Cancelled</span>`;
      } else {
        score = `<span class="upcoming">${fmtTime(g.game_date)}</span>`;
      }
      return `<div class="game-row">
        <div class="game-when">${fmtDate(g.game_date)}<br>${esc(g.teams.name)}</div>
        <div class="game-what">
          <strong>${g.is_home ? 'vs' : '@'} ${esc(g.opponent)}</strong>
          <span>${[g.tournament, g.location].filter(Boolean).map(esc).join(' · ')}</span>
        </div>
        <div class="game-score">${score}</div>
      </div>`;
    }

    function render() {
      const filtered = current === 'all' ? games : games.filter(g => g.teams.slug === current);
      if (!filtered.length) {
        body.innerHTML = `<p class="empty">No games on the calendar yet for this team — new dates get posted here first.</p>`;
        return;
      }
      const now = Date.now();
      const upcoming = filtered.filter(g => new Date(g.game_date).getTime() >= now && g.status !== 'final');
      const past = filtered.filter(g => !(new Date(g.game_date).getTime() >= now && g.status !== 'final')).reverse();
      body.innerHTML = `
        ${upcoming.length ? `<h3 style="margin: 0 0 0.9rem;">Upcoming</h3><div class="game-list">${upcoming.map(rowHTML).join('')}</div>` : ''}
        ${past.length ? `<h3 style="margin: 2.2rem 0 0.9rem;">Results</h3><div class="game-list">${past.map(rowHTML).join('')}</div>` : ''}
      `;
    }

    function renderTabs() {
      const all = [{ slug: 'all', name: 'All' }, ...teams];
      tabs.innerHTML = all.map(t =>
        `<button role="tab" aria-selected="${t.slug === current}" data-slug="${t.slug}">${esc(t.name)}</button>`
      ).join('');
      tabs.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        current = b.dataset.slug;
        renderTabs();
        render();
      }));
    }

    (async () => {
      try {
        [teams, games] = await Promise.all([getTeams(), getAllGames()]);
        renderTabs();
        render();
      } catch {
        unavailable(body, 'The schedule');
      }
    })();
  </script>
</body>
</html>
