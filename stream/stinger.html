<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blue Steel — Stinger Transition</title>
<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://api.fontshare.com/v2/css?f[]=tanker@400&f[]=supreme@400,500,700&display=swap" rel="stylesheet" />
<style>
  :root{
    --field:#0a0e16; --field-deep:#060910; --dugout:#121a29;
    --chalk:#f2f0e9; --steel:#7fc0ef; --steel-strong:#a9d8fa;
    --clay:#c4653b; --clay-bright:#e0794a;
    /* total = 2x sweep. Screen is fully covered at 50% (the OBS transition point). */
    --dur: 1200ms;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent}
  /* OBS: leave background transparent. For a quick dark preview add ?bg=1 */
  body.bg{background:var(--field-deep)}

  #stage{position:fixed;inset:0}

  /* Each panel is an over-wide skewed slab. All three share ONE timeline and are
     offset in SPACE (not time) so the sweep reads as layered without ever leaving
     a transparent gap during the covered hold. */
  .panel{
    position:absolute; top:-12%; height:124%; width:170vw;
    will-change:transform;
    animation:sweep var(--dur) cubic-bezier(.66,0,.24,1) both;
  }
  .p1{ left:-7vw; background:linear-gradient(100deg,#0b1220 0%, var(--dugout) 55%, #0b1220 100%); }
  .p2{ left: 7vw; background:linear-gradient(100deg,var(--steel) 0%, var(--steel-strong) 55%, var(--steel) 100%); }
  .p3{ left: 0;   background:linear-gradient(100deg,var(--field-deep) 0%, var(--field) 60%, var(--field-deep) 100%); }

  /* chalk-line pinstripes riding the steel slab */
  .p2::after{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(100deg, rgba(8,16,25,0) 0 46px, rgba(8,16,25,.18) 46px 50px);
    mix-blend-mode:multiply;
  }
  /* clay wipe-line on the leading (right) edge of each slab */
  .panel::before{
    content:""; position:absolute; top:0; bottom:0; left:100%; width:24px;
    background:linear-gradient(var(--clay-bright),var(--clay));
    box-shadow:0 0 40px 6px rgba(224,121,74,.5);
  }

  @keyframes sweep{
    0%   { transform:translateX(-200vw) skewX(-12deg); }  /* off left */
    40%  { transform:translateX(-15vw)  skewX(-12deg); }  /* fully covering */
    58%  { transform:translateX(-15vw)  skewX(-12deg); }  /* HOLD — opaque window */
    100% { transform:translateX(160vw)  skewX(-12deg); }  /* gone off right */
  }

  /* Skull mark punches in at the cover moment */
  #mark{
    position:absolute; left:50%; top:50%;
    width:min(30vw,340px); aspect-ratio:1;
    transform:translate(-50%,-50%) scale(.2) rotate(-14deg);
    opacity:0;
    filter:drop-shadow(0 0 34px rgba(127,192,239,.55));
    animation:mark var(--dur) cubic-bezier(.7,0,.2,1) both;
  }
  #mark img{width:100%;height:100%;object-fit:contain;display:block;
    -webkit-mask:radial-gradient(circle at 50% 48%, #000 52%, transparent 72%);
            mask:radial-gradient(circle at 50% 48%, #000 52%, transparent 72%)}
  @keyframes mark{
    0%,34%   { opacity:0; transform:translate(-50%,-50%) scale(.3) rotate(-12deg); }
    44%      { opacity:1; transform:translate(-50%,-50%) scale(1.08) rotate(0deg); }
    54%      { opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
    64%,100% { opacity:0; transform:translate(-50%,-50%) scale(1.14) rotate(6deg); }
  }

  /* wordmark ghost that streaks behind the skull */
  #word{
    position:absolute; left:50%; top:calc(50% + min(20vw,220px));
    transform:translate(-50%,-50%);
    font-family:'Tanker','Arial Black',sans-serif; letter-spacing:.14em;
    font-size:clamp(1.4rem,4.4vw,3.2rem); color:var(--chalk);
    text-transform:uppercase; white-space:nowrap; opacity:0;
    text-shadow:0 2px 30px rgba(6,9,16,.8);
    animation:word var(--dur) ease both;
  }
  @keyframes word{
    0%,42%{opacity:0; letter-spacing:.04em}
    50%{opacity:1; letter-spacing:.2em}
    60%,100%{opacity:0}
  }

  /* steel flash at the instant of cover sells the cut */
  #flash{position:absolute;inset:0;background:var(--steel-strong);opacity:0;animation:flash var(--dur) ease both}
  @keyframes flash{0%,34%{opacity:0}40%{opacity:.5}48%,100%{opacity:0}}
</style>
</head>

<script>
  // ?bg=1 -> dark preview background. ?loop=1 -> replay on a loop for previewing.
  const q = new URLSearchParams(location.search);
  if(q.has('bg')) document.body.classList.add('bg');

  const stage = document.getElementById('stage');
  function play(){
    // force a reflow-based restart of every animation
    const clone = stage.cloneNode(true);
    stage.replaceWith(clone);
  }
  if(q.has('loop')){
    const ms = 1200 + 260; // duration + gap
    setInterval(play, ms + 900);
  }
  // click / keypress to fire again (handy while cueing in OBS with "refresh on active")
  addEventListener('click', play);
  addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();play();} });
</script>
