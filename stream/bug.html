<title>Blue Steel — Logo Bug / Lower Third</title>

<style>
  :root{
    --field:#0a0e16; --field-deep:#060910; --dugout:#121a29; --dugout-2:#0e1520;
    --chalk:#f2f0e9; --muted:#93a3b8; --faint:#5f7086;
    --steel:#7fc0ef; --steel-strong:#a9d8fa;
    --clay:#c4653b; --clay-bright:#e0794a;
    --chalk-line:rgba(242,240,233,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;
    font-family:'Supreme','Helvetica Neue',Arial,sans-serif;color:var(--chalk)}
  body.bg{background:#123 url('') center/cover}  /* ?bg=1 for a preview backdrop */
  body.bg{background:linear-gradient(120deg,#1c2a3f,#0a121e)}

  /* position presets: default bottom-left. ?pos=br|tr|tl|bl */
  #wrap{position:fixed;left:3.4vw;bottom:6vh}
  #wrap.tr{left:auto;right:3.4vw;top:5vh;bottom:auto}
  #wrap.tl{left:3.4vw;top:5vh;bottom:auto}
  #wrap.br{left:auto;right:3.4vw;bottom:6vh}

  .bar{display:flex;align-items:stretch;gap:0;
    filter:drop-shadow(0 10px 30px rgba(6,9,16,.55));
    animation:slidein .7s cubic-bezier(.2,.85,.2,1) both}
  @keyframes slidein{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}

  .mark{width:74px;height:74px;flex:none;background:var(--dugout);
    display:grid;place-items:center;border:1px solid var(--chalk-line);
    clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)}
  .mark img{width:88%;height:88%;object-fit:contain;
    -webkit-mask:radial-gradient(circle at 50% 48%, #000 54%, transparent 74%);
            mask:radial-gradient(circle at 50% 48%, #000 54%, transparent 74%);
    filter:drop-shadow(0 0 10px rgba(127,192,239,.5));
    animation:pulse 3.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  .txt{background:rgba(10,14,22,.82);backdrop-filter:blur(6px);
    border:1px solid var(--chalk-line);border-left:none;
    padding:.62rem 1.5rem .62rem 1.1rem;display:flex;flex-direction:column;justify-content:center;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%);
    overflow:hidden}
  .txt strong{font-family:'Tanker','Arial Black',sans-serif;font-weight:400;letter-spacing:.11em;
    font-size:1.28rem;text-transform:uppercase;line-height:1;white-space:nowrap;
    animation:rise .7s ease .12s both}
  .txt span{font-family:'Martian Mono',monospace;font-size:.56rem;letter-spacing:.34em;
    color:var(--steel);text-transform:uppercase;margin-top:.38rem;white-space:nowrap;
    animation:rise .7s ease .2s both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  /* clay accent seam that wipes across on entry */
  .txt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--clay-bright);
    box-shadow:0 0 12px var(--clay-bright)}
  .sheen{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.18) 48%,transparent 62%);
    transform:translateX(-120%);animation:sheen 5s ease-in-out 1s infinite}
  @keyframes sheen{0%{transform:translateX(-120%)}22%,100%{transform:translateX(160%)}}
</style>
</head>
