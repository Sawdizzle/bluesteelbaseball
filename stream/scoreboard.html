<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blue Steel — Scoreboard Overlay</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://api.fontshare.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://api.fontshare.com/v2/css?f[]=tanker@400&f[]=supreme@400,500,700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --field:#0a0e16; --field-deep:#060910; --dugout:#121a29; --dugout-2:#0e1520;
    --chalk:#f2f0e9; --muted:#93a3b8; --faint:#5f7086;
    --steel:#7fc0ef; --steel-strong:#a9d8fa;
    --clay:#c4653b; --clay-bright:#e0794a;
    --chalk-line:rgba(242,240,233,.16);
    --scale:1;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;
    font-family:'Supreme','Helvetica Neue',Arial,sans-serif;color:var(--chalk)}
  body.bg{background:linear-gradient(120deg,#20303f,#0a121e)}   /* ?bg=1 preview only */

  #anchor{position:fixed;transform-origin:bottom left}
  #anchor.bl{left:40px;bottom:40px}
  #anchor.br{right:40px;bottom:40px;transform-origin:bottom right}
  #anchor.tl{left:40px;top:40px;transform-origin:top left}
  #anchor.tr{right:40px;top:40px;transform-origin:top right}

  #bug{
    display:flex;align-items:stretch;
    background:linear-gradient(180deg,rgba(18,26,41,.96),rgba(10,14,22,.96));
    border:1px solid var(--chalk-line);
    box-shadow:0 18px 46px rgba(0,0,0,.55), inset 0 1px 0 rgba(242,240,233,.05);
    clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
    transition:transform .5s cubic-bezier(.2,.8,.2,1), opacity .5s ease;
  }
  #bug.hidden{transform:translateY(140%) scale(.96);opacity:0}
  #anchor.tl #bug.hidden,#anchor.tr #bug.hidden{transform:translateY(-140%) scale(.96)}

  /* ---- teams column ---- */
  .teams{display:flex;flex-direction:column;justify-content:center;min-width:236px}
  .team{display:flex;align-items:center;gap:.6rem;padding:.5rem .8rem;position:relative}
  .team+.team{border-top:1px solid var(--chalk-line)}
  .team .bat{position:absolute;left:0;top:12%;bottom:12%;width:4px;background:var(--clay-bright);
    box-shadow:0 0 12px var(--clay-bright);opacity:0;transition:opacity .25s}
  .team.batting .bat{opacity:1}
  .chip{width:30px;height:30px;flex:none;border-radius:5px;background:rgba(242,240,233,.06);
    border:1px solid var(--chalk-line);display:grid;place-items:center;overflow:hidden}
  .team.accent .chip{background:linear-gradient(180deg,rgba(127,192,239,.3),rgba(127,192,239,.08));
    border-color:rgba(127,192,239,.5)}
  .chip img{width:112%;height:112%;object-fit:contain;
    -webkit-mask:radial-gradient(circle at 50% 47%,#000 52%,transparent 72%);
            mask:radial-gradient(circle at 50% 47%,#000 52%,transparent 72%)}
  .chip .initial{display:none;font-family:'Tanker','Arial Black',sans-serif;font-size:1.05rem;color:var(--muted)}
  /* a custom team photo fills the chip with no skull mask (JS toggles img vs initial) */
  .chip img.logo{ -webkit-mask:none; mask:none; width:100%; height:100%; object-fit:contain; }
  .tname{font-family:'Tanker','Arial Black',sans-serif;font-weight:400;letter-spacing:.05em;
    text-transform:uppercase;font-size:1.28rem;line-height:1;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:150px;flex:1}
  .team.accent .tname{color:var(--steel-strong)}
  .tscore{font-family:'Martian Mono',monospace;font-weight:700;font-size:1.7rem;line-height:1;
    min-width:2.1ch;text-align:center;color:var(--chalk);
    background:rgba(6,9,16,.6);border:1px solid var(--chalk-line);padding:.12rem .35rem;border-radius:4px}

  .sep{width:1px;background:var(--chalk-line);flex:none}

  /* ---- middle: inning + diamond + outs ---- */
  .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.42rem;
    padding:.5rem .95rem}
  .inning{display:flex;align-items:center;gap:.34rem;font-family:'Martian Mono',monospace;font-weight:700}
  .inning .arw{color:var(--steel);font-size:.8rem;line-height:1;transition:transform .25s}
  .inning .arw.bottom{color:var(--clay-bright)}
  .inning .num{font-size:1.15rem;color:var(--chalk);min-width:1.4ch;text-align:center}

  .diamond{position:relative;width:52px;height:52px}
  .base{position:absolute;width:17px;height:17px;background:rgba(242,240,233,.08);
    border:1.5px solid var(--chalk-line);transform:rotate(45deg);transition:transform .18s ease}
  .base.b2{top:0;left:50%;margin-left:-8.5px}
  .base.b1{right:0;top:50%;margin-top:-8.5px}
  .base.b3{left:0;top:50%;margin-top:-8.5px}
  .base.on{background:linear-gradient(135deg,var(--clay-bright),var(--clay));
    border-color:var(--clay-bright);box-shadow:0 0 14px rgba(224,121,74,.75)}
  .base.pop{animation:basepop .34s ease}
  @keyframes basepop{0%{transform:rotate(45deg) scale(1)}45%{transform:rotate(45deg) scale(1.4)}100%{transform:rotate(45deg) scale(1)}}

  .outs{display:flex;gap:.32rem;align-items:center}
  .odot{width:10px;height:10px;border-radius:50%;background:rgba(242,240,233,.14);
    border:1px solid var(--chalk-line);transition:all .2s ease}
  .odot.on{background:var(--clay-bright);border-color:var(--clay-bright);box-shadow:0 0 9px var(--clay-bright)}

  /* ---- count column ---- */
  .count{display:flex;flex-direction:column;justify-content:center;gap:.3rem;padding:.5rem .9rem;min-width:70px}
  .crow{display:flex;align-items:center;gap:.45rem}
  .clabel{font-family:'Martian Mono',monospace;font-size:.56rem;letter-spacing:.14em;color:var(--faint);
    text-transform:uppercase;width:1.1ch}
  .pips{display:flex;gap:.24rem}
  .pip{width:9px;height:9px;border-radius:50%;background:rgba(242,240,233,.13);border:1px solid var(--chalk-line);transition:all .18s ease}
  .pip.on.ball{background:var(--steel);border-color:var(--steel);box-shadow:0 0 8px rgba(127,192,239,.7)}
  .pip.on.strike{background:var(--clay-bright);border-color:var(--clay-bright);box-shadow:0 0 8px rgba(224,121,74,.7)}
  .pc-row{display:none} #bug.show-pc .pc-row{display:flex}
  .pcnum{font-family:'Martian Mono',monospace;font-weight:700;font-size:.82rem;color:var(--chalk)}

  /* value pop on change */
  .flash{animation:flash .5s ease}
  @keyframes flash{0%{transform:scale(1)}30%{transform:scale(1.28);color:var(--steel-strong)}100%{transform:scale(1)}}

  /* status banner replaces the count/mid when set (FINAL / MID 5 / DELAY) */
  .banner{display:none;align-items:center;padding:.5rem 1.1rem;
    font-family:'Tanker','Arial Black',sans-serif;letter-spacing:.14em;text-transform:uppercase;
    font-size:1.1rem;color:var(--ink,#170b06);
    background:linear-gradient(180deg,var(--clay-bright),var(--clay))}
  #bug.has-status .mid,#bug.has-status .count,#bug.has-status .sep.s2{display:none}
  #bug.has-status .banner{display:flex}

  /* ---- big-play FX layer ---- */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
  .fx-big{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;opacity:0;white-space:nowrap}
  .fx-big::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:150%;height:360%;z-index:-1;
    background:radial-gradient(ellipse at center, rgba(6,9,16,.62), rgba(6,9,16,.28) 45%, transparent 70%)}
  .fx-big.show{animation:fxbig 3.4s cubic-bezier(.2,.8,.2,1) forwards}
  .fx-big .lead{font-family:'Tanker','Arial Black',sans-serif;text-transform:uppercase;letter-spacing:.05em;
    font-size:clamp(3rem,11vw,9rem);line-height:.92;
    background:linear-gradient(180deg,var(--steel-strong),var(--steel) 46%,var(--clay-bright));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 8px 26px rgba(127,192,239,.45)) drop-shadow(0 2px 2px rgba(0,0,0,.4))}
  .fx-big .sub{font-family:'Martian Mono',monospace;letter-spacing:.42em;color:var(--chalk);
    text-transform:uppercase;font-size:clamp(.7rem,1.7vw,1.15rem);margin-top:.5rem}
  @keyframes fxbig{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
    10%{opacity:1;transform:translate(-50%,-50%) scale(1.07)}
    18%{transform:translate(-50%,-50%) scale(1)}
    84%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-52%) scale(1.03)}}

  .confetti{position:absolute;top:-8vh;width:11px;height:15px;border-radius:2px;opacity:.95;will-change:transform}
  @keyframes fall{0%{transform:translateY(-10vh) rotate(0);opacity:0}
    8%{opacity:1}100%{transform:translateY(114vh) rotate(760deg);opacity:.9}}

  .fx-tag{position:absolute;left:50%;bottom:17%;transform:translate(-50%,20px);opacity:0;
    font-family:'Tanker','Arial Black',sans-serif;text-transform:uppercase;letter-spacing:.1em;
    font-size:clamp(1.4rem,3.8vw,2.7rem);padding:.5rem 1.6rem;color:#170b06;
    background:linear-gradient(180deg,var(--clay-bright),var(--clay));
    clip-path:polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px);
    box-shadow:0 16px 44px rgba(0,0,0,.5)}
  .fx-tag.steel{background:linear-gradient(180deg,var(--steel-strong),var(--steel));color:#081019}
  .fx-tag.gray{background:linear-gradient(180deg,#8fa0b4,#4a5768);color:#0a0f16}
  .fx-big.k .lead{background:linear-gradient(180deg,#ff9a86,var(--clay-bright) 52%,#b4331c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 8px 26px rgba(224,121,74,.55)) drop-shadow(0 2px 2px rgba(0,0,0,.45))}
  .fx-tag.show{animation:fxtag 2.3s ease forwards}
  @keyframes fxtag{0%{opacity:0;transform:translate(-50%,22px) scale(.92)}
    13%{opacity:1;transform:translate(-50%,0) scale(1)}
    82%{opacity:1;transform:translate(-50%,0) scale(1)}
    100%{opacity:0;transform:translate(-50%,-12px) scale(1)}}

  /* ---- per-style big-play theming (FX layer tagged with current style) ---- */
  #fx[data-style="jumbotron"] .fx-big .lead{background:linear-gradient(180deg,#ffe08a,#ffb028 55%,#ff7a00);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,176,40,.6)) drop-shadow(0 2px 2px rgba(0,0,0,.4))}
  #fx[data-style="jumbotron"] .fx-tag,#fx[data-style="jumbotron"] .fx-tag.steel{background:linear-gradient(180deg,#ffd888,#ffb028);color:#241400}

  #fx[data-style="neon"] .fx-big .lead{filter:drop-shadow(0 0 22px rgba(127,192,239,.85)) drop-shadow(0 0 40px rgba(224,121,74,.5))}
  #fx[data-style="neon"] .fx-tag{box-shadow:0 0 24px rgba(224,121,74,.6),0 14px 40px rgba(0,0,0,.5)}
  #fx[data-style="neon"] .fx-tag.steel{box-shadow:0 0 24px rgba(127,192,239,.75),0 14px 40px rgba(0,0,0,.5)}

  #fx[data-style="synthwave"] .fx-big .lead{background:linear-gradient(180deg,#ff4fa3,#c56bff 50%,#00e5ff);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,79,163,.6)) drop-shadow(0 0 30px rgba(0,229,255,.4))}
  #fx[data-style="synthwave"] .fx-tag{background:linear-gradient(180deg,#ff4fa3,#c556c9);color:#fff}
  #fx[data-style="synthwave"] .fx-tag.steel{background:linear-gradient(180deg,#00e5ff,#3aa7ff);color:#04222b}

  #fx[data-style="terminal"] .fx-big .lead{font-family:'Martian Mono',monospace;background:none;
    -webkit-text-fill-color:#23ff6e;color:#23ff6e;filter:drop-shadow(0 0 16px rgba(35,255,110,.85));letter-spacing:.02em}
  #fx[data-style="terminal"] .fx-big .sub{color:#7dffb0}
  #fx[data-style="terminal"] .fx-tag,#fx[data-style="terminal"] .fx-tag.steel{background:linear-gradient(180deg,#2bff77,#12b053);color:#03230f}

  #fx[data-style="chalk"] .fx-big .lead{background:none;-webkit-text-fill-color:#f4f2ea;color:#f4f2ea;filter:drop-shadow(0 2px 1px rgba(0,0,0,.5))}
  #fx[data-style="chalk"] .fx-tag,#fx[data-style="chalk"] .fx-tag.steel{background:#f4f2ea;color:#153029}

  #fx[data-style="bubblegum"] .fx-big .lead{background:linear-gradient(180deg,#ff7ac6,#ffd93b 60%,#8ff0ff);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,122,198,.6))}
  #fx[data-style="bubblegum"] .fx-tag{background:linear-gradient(180deg,#ff7ac6,#ff4fa3);color:#fff}
  #fx[data-style="bubblegum"] .fx-tag.steel{background:linear-gradient(180deg,#8ff0ff,#3ad0ff);color:#062633}

  /* ============================================================
     SCOREBOARD STYLES — set via [data-style] on #anchor
     classic = default (rules above). minimal / chalk / neon / jumbotron below.
     ============================================================ */

  /* ---- MINIMAL: clean, understated, low-key ---- */
  #anchor[data-style="minimal"] #bug{background:rgba(6,9,16,.64);border:none;clip-path:none;border-radius:11px;
    box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #anchor[data-style="minimal"] .sep{opacity:.35}
  #anchor[data-style="minimal"] .tscore{background:none;border:none}
  #anchor[data-style="minimal"] .chip{border-radius:50%;background:rgba(242,240,233,.05)}
  #anchor[data-style="minimal"] .team.accent .chip{background:rgba(127,192,239,.18)}
  #anchor[data-style="minimal"] .base{border-radius:2px}

  /* ---- CHALK: sandlot chalkboard, dashed hand-drawn ---- */
  #anchor[data-style="chalk"] #bug{background:linear-gradient(180deg,#153029,#0e231e);
    border:1px solid rgba(242,240,233,.3);clip-path:none;border-radius:5px;
    box-shadow:0 12px 30px rgba(0,0,0,.5),inset 0 0 46px rgba(0,0,0,.35)}
  #anchor[data-style="chalk"] .tname,#anchor[data-style="chalk"] .tscore,
  #anchor[data-style="chalk"] .inning .num,#anchor[data-style="chalk"] .clabel{
    color:#f4f2ea;font-family:'Tanker','Arial Black',sans-serif;text-shadow:0 0 1px rgba(244,242,234,.6)}
  #anchor[data-style="chalk"] .team.accent .tname{color:#fff}
  #anchor[data-style="chalk"] .inning .arw{color:#f4f2ea}
  #anchor[data-style="chalk"] .tscore{background:transparent;border:1px dashed rgba(244,242,234,.55)}
  #anchor[data-style="chalk"] .chip{background:transparent;border:1px dashed rgba(244,242,234,.45)}
  #anchor[data-style="chalk"] .sep{background:rgba(244,242,234,.28)}
  #anchor[data-style="chalk"] .base{background:transparent;border:1.5px dashed rgba(244,242,234,.55);box-shadow:none}
  #anchor[data-style="chalk"] .base.on{background:rgba(244,242,234,.9);border-style:solid;border-color:#fff;box-shadow:none}
  #anchor[data-style="chalk"] .odot{background:transparent;border:1.5px dashed rgba(244,242,234,.5)}
  #anchor[data-style="chalk"] .odot.on{background:#f4f2ea;border-color:#fff;box-shadow:none}
  #anchor[data-style="chalk"] .pip{background:transparent;border:1px dashed rgba(244,242,234,.45)}
  #anchor[data-style="chalk"] .pip.on{background:#f4f2ea!important;border-color:#fff!important;box-shadow:none!important}

  /* ---- NEON: glowing tubes, animated, over-the-top ---- */
  #anchor[data-style="neon"] #bug{background:rgba(3,5,11,.9);border:1.5px solid rgba(127,192,239,.9);
    clip-path:none;border-radius:12px;position:relative;overflow:hidden;
    animation:neonPulse 2.6s ease-in-out infinite}
  @keyframes neonPulse{
    0%,100%{box-shadow:0 0 20px rgba(127,192,239,.5),inset 0 0 16px rgba(127,192,239,.16),0 0 55px rgba(127,192,239,.25);border-color:rgba(127,192,239,.9)}
    50%{box-shadow:0 0 34px rgba(224,121,74,.55),inset 0 0 22px rgba(127,192,239,.24),0 0 85px rgba(127,192,239,.4);border-color:rgba(169,216,250,1)}}
  #anchor[data-style="neon"] #bug::after{content:"";position:absolute;left:0;right:0;height:40%;top:0;pointer-events:none;
    background:linear-gradient(rgba(169,216,250,.14),transparent);mix-blend-mode:screen;animation:neonScan 3.4s linear infinite}
  @keyframes neonScan{0%{transform:translateY(-110%)}100%{transform:translateY(320%)}}
  #anchor[data-style="neon"] .tname{color:#eaf6ff;text-shadow:0 0 8px rgba(127,192,239,.9),0 0 18px rgba(127,192,239,.55)}
  #anchor[data-style="neon"] .team.accent .tname{color:#d4efff;text-shadow:0 0 10px rgba(169,216,250,1),0 0 22px rgba(127,192,239,.7)}
  #anchor[data-style="neon"] .tscore{background:rgba(0,0,0,.45);border:1px solid rgba(127,192,239,.7);color:#fff;
    text-shadow:0 0 10px rgba(127,192,239,.9)}
  #anchor[data-style="neon"] .inning .num,#anchor[data-style="neon"] .inning .arw{text-shadow:0 0 10px currentColor,0 0 20px currentColor}
  #anchor[data-style="neon"] .base{border-color:rgba(127,192,239,.5)}
  #anchor[data-style="neon"] .base.on{box-shadow:0 0 16px var(--clay-bright),0 0 30px rgba(224,121,74,.65)}
  #anchor[data-style="neon"] .odot.on{box-shadow:0 0 14px var(--clay-bright),0 0 24px rgba(224,121,74,.6)}
  #anchor[data-style="neon"] .pip.on.ball{box-shadow:0 0 12px var(--steel),0 0 20px rgba(127,192,239,.7)}
  #anchor[data-style="neon"] .pip.on.strike{box-shadow:0 0 12px var(--clay-bright),0 0 20px rgba(224,121,74,.7)}

  /* ---- JUMBOTRON: retro stadium LED, amber dot-matrix ---- */
  #anchor[data-style="jumbotron"] #bug{background:#0a0b06;border:3px solid #1b1910;clip-path:none;border-radius:8px;
    position:relative;overflow:hidden;box-shadow:0 14px 42px rgba(0,0,0,.6),inset 0 0 34px rgba(0,0,0,.85)}
  #anchor[data-style="jumbotron"] .tname,#anchor[data-style="jumbotron"] .tscore,
  #anchor[data-style="jumbotron"] .inning .num,#anchor[data-style="jumbotron"] .clabel{
    font-family:'Martian Mono',monospace!important;color:#ffb028;text-shadow:0 0 6px rgba(255,176,40,.85),0 0 14px rgba(255,130,0,.5)}
  #anchor[data-style="jumbotron"] .tname{font-size:1.02rem;letter-spacing:.02em;max-width:168px}
  #anchor[data-style="jumbotron"] .team.accent .tname{color:#ffd888}
  #anchor[data-style="jumbotron"] .teams{min-width:250px}
  #anchor[data-style="jumbotron"] .tscore{background:rgba(0,0,0,.55);border:1px solid rgba(255,176,40,.35)}
  #anchor[data-style="jumbotron"] .inning .arw{color:#79f56a;text-shadow:0 0 8px rgba(121,245,106,.85)}
  #anchor[data-style="jumbotron"] .sep{background:rgba(255,176,40,.22)}
  #anchor[data-style="jumbotron"] .base{border-color:rgba(255,176,40,.3);background:rgba(255,176,40,.05)}
  #anchor[data-style="jumbotron"] .base.on{background:linear-gradient(135deg,#ffd888,#ffb028);border-color:#ffb028;
    box-shadow:0 0 14px rgba(255,176,40,.85)}
  #anchor[data-style="jumbotron"] .odot.on{background:#ff5a3c;border-color:#ff5a3c;box-shadow:0 0 12px #ff5a3c}
  #anchor[data-style="jumbotron"] .pip.on.ball{background:#79f56a!important;border-color:#79f56a!important;box-shadow:0 0 9px #79f56a!important}
  #anchor[data-style="jumbotron"] .pip.on.strike{background:#ff5a3c!important;border-color:#ff5a3c!important;box-shadow:0 0 9px #ff5a3c!important}
  /* LED dot texture + rolling scanlines */
  #anchor[data-style="jumbotron"] #bug::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(rgba(0,0,0,.4) 40%, transparent 42%);background-size:3px 3px;mix-blend-mode:multiply}
  #anchor[data-style="jumbotron"] #bug::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 3px);animation:jumboFlicker 5s steps(40) infinite}
  @keyframes jumboFlicker{0%,100%{opacity:.55}45%{opacity:.72}55%{opacity:.5}92%{opacity:.68}96%{opacity:.42}}

  /* ---- SYNTHWAVE: 80s sunset, magenta/cyan, perspective grid ---- */
  #anchor[data-style="synthwave"] #bug{background:linear-gradient(180deg,#2a0a4a,#0f0524);border:1.5px solid #ff4fa3;
    clip-path:none;border-radius:10px;position:relative;overflow:hidden;animation:swGlow 3s ease-in-out infinite}
  @keyframes swGlow{
    0%,100%{box-shadow:0 0 22px rgba(255,79,163,.5),0 0 55px rgba(0,229,255,.22),inset 0 0 18px rgba(0,229,255,.1)}
    50%{box-shadow:0 0 34px rgba(0,229,255,.5),0 0 80px rgba(255,79,163,.35),inset 0 0 24px rgba(255,79,163,.16)}}
  #anchor[data-style="synthwave"] #bug::before{content:"";position:absolute;left:0;right:0;bottom:0;height:48%;pointer-events:none;
    background:repeating-linear-gradient(90deg, rgba(0,229,255,.4) 0 1px, transparent 1px 26px),
      linear-gradient(transparent, rgba(255,79,163,.14));
    transform:perspective(120px) rotateX(56deg);transform-origin:bottom;opacity:.55}
  #anchor[data-style="synthwave"] .tname{color:#fff;text-shadow:0 0 8px #ff4fa3,0 0 16px #ff4fa3}
  #anchor[data-style="synthwave"] .team.accent .tname{color:#c2f7ff;text-shadow:0 0 10px #00e5ff,0 0 20px #00e5ff}
  #anchor[data-style="synthwave"] .tscore{background:rgba(0,0,0,.35);border:1px solid #ff4fa3;color:#fff;text-shadow:0 0 10px #ff4fa3}
  #anchor[data-style="synthwave"] .inning .num{color:#00e5ff;text-shadow:0 0 10px #00e5ff}
  #anchor[data-style="synthwave"] .inning .arw{color:#ff4fa3;text-shadow:0 0 8px #ff4fa3}
  #anchor[data-style="synthwave"] .base.on{background:linear-gradient(135deg,#ff4fa3,#00e5ff);border-color:#ff4fa3;box-shadow:0 0 16px #ff4fa3}
  #anchor[data-style="synthwave"] .odot.on{background:#ff4fa3;border-color:#ff4fa3;box-shadow:0 0 12px #ff4fa3}
  #anchor[data-style="synthwave"] .pip.on.ball{background:#00e5ff!important;border-color:#00e5ff!important;box-shadow:0 0 10px #00e5ff!important}
  #anchor[data-style="synthwave"] .pip.on.strike{background:#ff4fa3!important;border-color:#ff4fa3!important;box-shadow:0 0 10px #ff4fa3!important}

  /* ---- BROADCAST: clean pro look, team-color bars ---- */
  #anchor[data-style="broadcast"] #bug{background:linear-gradient(180deg,#0e1626,#0a1018);border:none;clip-path:none;
    border-radius:6px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.55)}
  #anchor[data-style="broadcast"] .team{padding-left:1.05rem}
  #anchor[data-style="broadcast"] .team.away{box-shadow:inset 6px 0 0 var(--clay)}
  #anchor[data-style="broadcast"] .team.home{box-shadow:inset 6px 0 0 var(--steel)}
  #anchor[data-style="broadcast"] .team .bat{display:none}
  #anchor[data-style="broadcast"] .team.batting{background:linear-gradient(90deg,rgba(242,240,233,.08),transparent)}
  #anchor[data-style="broadcast"] .tscore{background:rgba(0,0,0,.32);border:none;color:#fff;font-size:1.85rem}
  #anchor[data-style="broadcast"] .team.home .tscore{color:var(--steel-strong)}
  #anchor[data-style="broadcast"] .sep{opacity:.25}

  /* ---- TERMINAL: green matrix monospace ---- */
  #anchor[data-style="terminal"] #bug{background:rgba(0,10,3,.92);border:1px solid #1f7a3d;clip-path:none;border-radius:4px;
    position:relative;overflow:hidden;box-shadow:0 0 18px rgba(35,255,110,.25),inset 0 0 20px rgba(0,0,0,.6)}
  #anchor[data-style="terminal"] .tname,#anchor[data-style="terminal"] .tscore,
  #anchor[data-style="terminal"] .inning .num,#anchor[data-style="terminal"] .clabel{
    font-family:'Martian Mono',monospace!important;color:#23ff6e;text-shadow:0 0 6px rgba(35,255,110,.7)}
  #anchor[data-style="terminal"] .tname{font-size:1.05rem;letter-spacing:.02em;max-width:168px}
  #anchor[data-style="terminal"] .teams{min-width:250px}
  #anchor[data-style="terminal"] .team.accent .tname{color:#7dffb0}
  #anchor[data-style="terminal"] .tscore{background:transparent;border:1px solid rgba(35,255,110,.4)}
  #anchor[data-style="terminal"] .inning .arw{color:#23ff6e;text-shadow:0 0 6px rgba(35,255,110,.7)}
  #anchor[data-style="terminal"] .sep{background:rgba(35,255,110,.25)}
  #anchor[data-style="terminal"] .chip{border:1px solid rgba(35,255,110,.4);background:transparent}
  #anchor[data-style="terminal"] .base{border-color:rgba(35,255,110,.45);background:transparent}
  #anchor[data-style="terminal"] .base.on{background:#23ff6e;border-color:#23ff6e;box-shadow:0 0 12px #23ff6e}
  #anchor[data-style="terminal"] .odot{border-color:rgba(35,255,110,.45)}
  #anchor[data-style="terminal"] .odot.on{background:#23ff6e;border-color:#23ff6e;box-shadow:0 0 10px #23ff6e}
  #anchor[data-style="terminal"] .pip{border-color:rgba(35,255,110,.45)}
  #anchor[data-style="terminal"] .pip.on{background:#23ff6e!important;border-color:#23ff6e!important;box-shadow:0 0 8px #23ff6e!important}
  #anchor[data-style="terminal"] #bug::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.14) 2px 3px);animation:jumboFlicker 5s steps(40) infinite}

  /* ---- BUBBLEGUM: bright, rounded, playful (kids) ---- */
  #anchor[data-style="bubblegum"] #bug{background:linear-gradient(180deg,#271748,#1a1030);border:3px solid #ff7ac6;
    clip-path:none;border-radius:20px;box-shadow:0 12px 34px rgba(0,0,0,.5),0 0 0 3px rgba(122,232,255,.25),0 0 26px rgba(255,122,198,.3)}
  #anchor[data-style="bubblegum"] .tname{color:#fff;text-shadow:0 2px 0 #ff7ac6,0 0 12px rgba(255,122,198,.6)}
  #anchor[data-style="bubblegum"] .team.accent .tname{color:#8ff0ff;text-shadow:0 2px 0 #23a7c9,0 0 12px rgba(122,232,255,.6)}
  #anchor[data-style="bubblegum"] .tscore{background:#ffd93b;color:#241640;border:2px solid #fff;border-radius:10px;text-shadow:none}
  #anchor[data-style="bubblegum"] .chip{border-radius:50%;border:2px solid #ff7ac6;background:rgba(255,122,198,.15)}
  #anchor[data-style="bubblegum"] .inning .num{color:#ffd93b;text-shadow:0 0 10px rgba(255,217,59,.6)}
  #anchor[data-style="bubblegum"] .inning .arw{color:#8ff0ff}
  #anchor[data-style="bubblegum"] .sep{background:rgba(255,255,255,.22)}
  #anchor[data-style="bubblegum"] .base{border-radius:5px;border:2px solid #8ff0ff;background:transparent}
  #anchor[data-style="bubblegum"] .base.on{background:linear-gradient(135deg,#ff7ac6,#ffd93b);border-color:#fff;box-shadow:0 0 16px #ff7ac6}
  #anchor[data-style="bubblegum"] .odot.on{background:#ffd93b;border-color:#fff;box-shadow:0 0 10px #ffd93b}
  #anchor[data-style="bubblegum"] .pip.on.ball{background:#8ff0ff!important;border-color:#fff!important;box-shadow:0 0 9px #8ff0ff!important}
  #anchor[data-style="bubblegum"] .pip.on.strike{background:#ff7ac6!important;border-color:#fff!important;box-shadow:0 0 9px #ff7ac6!important}
</style>

        <div class="crow pc-row"><span class="clabel">PC</span><span class="pcnum" id="pcnum">0</span></div>
      </div>
      <div class="banner" id="banner"></div>
    </div>
  </div>
  <div id="fx"></div>

<script type="module">
  import { getScoreboard, onScoreboard } from './scoreboard-shared.js';

  const q = new URLSearchParams(location.search);
  const anchor = document.getElementById('anchor');
  anchor.className = ['bl','br','tl','tr'].includes(q.get('pos')) ? q.get('pos') : 'bl';
  if (q.has('bg')) document.body.classList.add('bg');
  const scale = parseFloat(q.get('scale'));
  if (scale > 0) anchor.style.transform = `scale(${scale})`;
  const STYLES = ['classic','minimal','chalk','neon','jumbotron','synthwave','broadcast','terminal','bubblegum'];
  const forcedStyle = STYLES.includes(q.get('style')) ? q.get('style') : null;
  anchor.dataset.style = forcedStyle || 'classic';
  const SHOW_PC = q.has('pc');   // show pitch count on the bug

  const $ = (id) => document.getElementById(id);
  const bug = $('bug');
  const FX = $('fx');
  const SKULL = $('img-home').getAttribute('src');   // default skull data URI
  let cur = null;   // last rendered state
  let lastFx;       // fx_at already handled (undefined = arm on first render)

  // team chip: custom photo → skull (our side) → initial letter (opponent)
  function setChip(side, logo, isAccent, name){
    const img = $('img-'+side), init = $('init-'+side);
    if (logo){
      if (img.dataset.logo !== logo){ img.src = logo; img.dataset.logo = logo; }
      img.dataset.mode = 'logo'; img.classList.add('logo');
      img.style.display = 'block'; init.style.display = 'none';
    } else if (isAccent){
      if (img.dataset.mode !== 'skull'){ img.src = SKULL; img.dataset.mode = 'skull'; delete img.dataset.logo; }
      img.classList.remove('logo');
      img.style.display = 'block'; init.style.display = 'none';
    } else {
      img.style.display = 'none'; init.style.display = 'block';
      init.textContent = (String(name).trim()[0] || '?').toUpperCase();
    }
  }

  // ---- synthesized sound (plays out through the OBS browser source; ?mute=1 to silence) ----
  const MUTE = q.has('mute') || q.get('sound') === '0';
  const VOL = Math.max(0, Math.min(1, parseFloat(q.get('vol')) || 0.8));
  let AC = null;
  function actx(){ try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume().catch(() => {}); } catch { AC = null; } return AC; }
  function envGain(c, t0, a, d, peak){ const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * VOL), t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d); return g; }
  function beep(freq, t0, dur, o1 = {}){ const c = actx(); if (!c) return;
    const o = c.createOscillator(); o.type = o1.type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (o1.slideTo) o.frequency.exponentialRampToValueAtTime(o1.slideTo, t0 + dur);
    const g = envGain(c, t0, Math.min(0.02, dur * 0.25), dur, o1.peak != null ? o1.peak : 0.25);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.05); }
  function noise(t0, dur, o1 = {}){ const c = actx(); if (!c) return;
    const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = o1.type || 'bandpass';
    f.frequency.setValueAtTime(o1.freq || 1200, t0);
    if (o1.slideTo) f.frequency.exponentialRampToValueAtTime(o1.slideTo, t0 + dur);
    f.Q.value = o1.q || 0.7;
    const g = envGain(c, t0, 0.005, dur, o1.peak != null ? o1.peak : 0.3);
    src.connect(f).connect(g).connect(c.destination); src.start(t0); src.stop(t0 + dur + 0.02); }
  const crack = (t) => noise(t, 0.05, { peak: 0.5, freq: 2500, q: 1 });
  function sfx(kind){
    if (MUTE) return; const c = actx(); if (!c) return; const t = c.currentTime + 0.02;
    switch (kind){
      case 'homerun': case 'grandslam':
        [523.25,659.25,783.99,1046.5].forEach((f,i)=>beep(f,t+i*0.12,0.2,{type:'square',peak:0.22}));
        beep(1318.5,t+0.5,0.55,{type:'square',peak:0.18});
        noise(t,0.9,{peak:0.15,freq:3500,type:'highpass'}); break;   // crowd swell
      case 'strikeout':
        beep(420,t,0.5,{type:'sawtooth',peak:0.3,slideTo:70});       // whiff down
        noise(t+0.02,0.16,{peak:0.18,freq:1600}); beep(150,t+0.44,0.26,{type:'square',peak:0.22}); break;
      case 'hit':    crack(t); beep(880,t+0.02,0.12,{type:'triangle',peak:0.16}); break;
      case 'double': crack(t); beep(659,t+0.03,0.14,{peak:0.18}); beep(988,t+0.16,0.16,{peak:0.18}); break;
      case 'triple': crack(t); [659,880,1175].forEach((f,i)=>beep(f,t+0.03+i*0.11,0.14,{peak:0.18})); break;
      case 'run':    beep(880,t,0.12,{peak:0.22}); beep(1318.5,t+0.1,0.2,{peak:0.22}); break;
      case 'walk': case 'hbp': beep(392,t,0.14,{type:'triangle',peak:0.2}); beep(523.25,t+0.12,0.2,{type:'triangle',peak:0.2}); break;
      case 'steal':  noise(t,0.35,{peak:0.22,freq:400,slideTo:3200}); break;   // whoosh
      case 'out':    beep(140,t,0.24,{peak:0.32}); break;                       // thud
      case 'doubleplay': beep(150,t,0.16,{peak:0.3}); beep(115,t+0.18,0.24,{peak:0.3}); break;
      // ---- soundboard (crowd) ----
      case 'charge':
        [523.25,523.25,659.25,783.99,1046.5].forEach((f,i)=>beep(f,t+i*0.13,0.16,{type:'square',peak:0.24}));
        beep(1046.5,t+0.66,0.42,{type:'square',peak:0.22}); break;   // bugle "CHARGE!"
      case 'airhorn':
        [[0,0.18],[0.26,0.18],[0.52,0.6]].forEach(([o,d])=>{
          beep(220,t+o,d,{type:'sawtooth',peak:0.28}); beep(330,t+o,d,{type:'sawtooth',peak:0.17});
          noise(t+o,d,{peak:0.08,freq:1200}); }); break;
      case 'rally': {                                              // stomp-stomp-clap x2
        const stomp=(o)=>{ beep(70,t+o,0.16,{type:'sine',peak:0.4}); noise(t+o,0.08,{peak:0.12,freq:200}); };
        const clap=(o)=>noise(t+o,0.05,{peak:0.42,freq:2200,q:1.2});
        stomp(0); stomp(0.28); clap(0.56); stomp(0.9); stomp(1.18); clap(1.46); break; }
      case 'bell':
        beep(880,t,0.6,{type:'sine',peak:0.3}); beep(1320,t,0.5,{type:'sine',peak:0.12}); beep(1760,t,0.4,{type:'sine',peak:0.07}); break;
      case 'boo':
        beep(300,t,0.7,{type:'sawtooth',peak:0.24,slideTo:110}); noise(t,0.5,{peak:0.08,freq:500,slideTo:200}); break;
      case 'whistle':
        beep(2100,t,0.5,{type:'sine',peak:0.2}); beep(2100,t+0.05,0.4,{type:'sine',peak:0.15,slideTo:2600}); break;
      default:       beep(660,t,0.15,{peak:0.2});
    }
  }

  // ---- big-play visuals ----
  const CONFETTI = ['#7fc0ef','#a9d8fa','#e0794a','#f2f0e9'];
  const CONFETTI_BY_STYLE = {
    jumbotron:['#ffb028','#ffd888','#79f56a','#ff5a3c'],
    neon:['#7fc0ef','#a9d8fa','#e0794a','#ffffff'],
    synthwave:['#ff4fa3','#00e5ff','#c2f7ff','#ffd93b'],
    terminal:['#23ff6e','#7dffb0','#0aff9d','#eafff2'],
    chalk:['#f4f2ea','#c9d6e6','#a9d8fa','#ffffff'],
    bubblegum:['#ff7ac6','#8ff0ff','#ffd93b','#ffffff'],
  };
  const curStyle = () => anchor.dataset.style || 'classic';
  function bigPlay(lead, opts = {}){
    const { confetti = true, scheme = '', sub = 'Blue Steel Baseball' } = opts;
    FX.innerHTML = ''; FX.dataset.style = curStyle();
    const palette = CONFETTI_BY_STYLE[curStyle()] || CONFETTI;
    const b = document.createElement('div'); b.className = 'fx-big' + (scheme ? ' ' + scheme : '');
    b.innerHTML = `<div class="lead">${lead}</div>` + (sub ? `<div class="sub">${sub}</div>` : '');
    FX.appendChild(b); void b.offsetWidth; b.classList.add('show');
    if (confetti) for (let i = 0; i < 44; i++){
      const c = document.createElement('div'); c.className = 'confetti';
      c.style.left = (Math.random()*100) + 'vw';
      c.style.background = palette[i % palette.length];
      c.style.animation = `fall ${(2.6 + Math.random()*1.7).toFixed(2)}s linear ${(Math.random()*0.5).toFixed(2)}s forwards`;
      c.style.transform = `rotate(${Math.floor(Math.random()*180)}deg)`;
      FX.appendChild(c);
    }
    clearTimeout(FX._t); FX._t = setTimeout(() => { FX.innerHTML = ''; }, 3700);
  }
  function tagPlay(text, variant = ''){
    FX.innerHTML = ''; FX.dataset.style = curStyle();
    const t = document.createElement('div'); t.className = 'fx-tag' + (variant ? ' ' + variant : '');
    t.textContent = text; FX.appendChild(t); void t.offsetWidth; t.classList.add('show');
    clearTimeout(FX._t); FX._t = setTimeout(() => { FX.innerHTML = ''; }, 2400);
  }
  const FX_MAP = {
    homerun:  () => bigPlay('Home Run', { confetti: true }),
    grandslam:() => bigPlay('Grand Slam', { confetti: true, sub: 'Bases Cleared' }),
    strikeout:() => bigPlay('Strikeout', { confetti: false, scheme: 'k', sub: '' }),
    triple:   () => tagPlay('Triple', 'steel'),
    double:   () => tagPlay('Double', 'steel'),
    hit:      () => tagPlay('Base Hit', 'steel'),
    run:      () => tagPlay('Run Scores', ''),
    walk:     () => tagPlay('Walk', 'steel'),
    hbp:      () => tagPlay('Hit By Pitch', 'steel'),
    steal:    () => tagPlay('Stolen Base', 'steel'),
    out:      () => tagPlay('Out', 'gray'),
    doubleplay:() => tagPlay('Double Play', 'gray'),
  };
  const SOUND_ONLY = { airhorn:1, bell:1, boo:1, whistle:1 };  // soundboard: audio, no visual
  const SOUND_TAG  = { charge:'Charge!', rally:'Rally!' };     // soundboard: small tag + audio
  function playFx(kind){
    sfx(kind);
    if (FX_MAP[kind]) return FX_MAP[kind]();
    if (SOUND_TAG[kind]) return tagPlay(SOUND_TAG[kind], '');
    if (SOUND_ONLY[kind]) return;
    tagPlay(String(kind).toUpperCase(), '');
  }

  const setText = (el, val, animate) => {
    if (el.textContent === String(val)) return;
    el.textContent = val;
    if (animate) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  };

  function buildPips(el, n, cls) {
    // ensure `n` pip slots exist
    while (el.children.length < n) { const s=document.createElement('span'); s.className=`pip ${cls}`; el.appendChild(s); }
    while (el.children.length > n) el.removeChild(el.lastChild);
  }

  function render(s, animate) {
    const prev = cur || {};

    // scoreboard style (phone-switchable; ?style= forces one for testing)
    anchor.dataset.style = forcedStyle || (STYLES.includes(s.style) ? s.style : 'classic');

    // teams
    setText($('away-name'), s.away_name, false);
    setText($('home-name'), s.home_name, false);
    setChip('away', s.away_logo, s.accent_side === 'away', s.away_name);
    setChip('home', s.home_logo, s.accent_side === 'home', s.home_name);
    setText($('away-score'), s.away_score, animate && s.away_score !== prev.away_score);
    setText($('home-score'), s.home_score, animate && s.home_score !== prev.home_score);
    $('row-away').classList.toggle('accent', s.accent_side === 'away');
    $('row-home').classList.toggle('accent', s.accent_side === 'home');
    // batting side: top -> away bats, bottom -> home bats
    $('row-away').classList.toggle('batting', s.half === 'top');
    $('row-home').classList.toggle('batting', s.half === 'bottom');

    // inning + arrow
    setText($('inning'), s.inning, animate && s.inning !== prev.inning);
    const arw = $('arrow');
    arw.textContent = s.half === 'top' ? '▲' : '▼';
    arw.classList.toggle('bottom', s.half === 'bottom');

    // bases
    [['b1', s.base1], ['b2', s.base2], ['b3', s.base3]].forEach(([id, on]) => {
      const el = $(id);
      const was = el.classList.contains('on');
      el.classList.toggle('on', !!on);
      if (animate && on && !was) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
    });

    // outs (0..2 dots; a 3rd out flips the half via control)
    $('o1').classList.toggle('on', s.outs >= 1);
    $('o2').classList.toggle('on', s.outs >= 2);

    // count pips (balls 0-3 -> 3 pips, strikes 0-2 -> 2 pips)
    buildPips($('balls'), 3, 'ball');
    buildPips($('strikes'), 2, 'strike');
    [...$('balls').children].forEach((p, i) => p.classList.toggle('on', i < s.balls));
    [...$('strikes').children].forEach((p, i) => p.classList.toggle('on', i < s.strikes));

    // pitch count (opt-in via ?pc=1)
    $('pcnum').textContent = s.pitch_count || 0;
    bug.classList.toggle('show-pc', SHOW_PC && (s.pitch_count||0) > 0);

    // status banner
    if (s.status) { $('banner').textContent = s.status; bug.classList.add('has-status'); }
    else bug.classList.remove('has-status');

    // visibility
    bug.classList.toggle('hidden', !s.visible);

    // big-play FX — arm on first render, then fire whenever fx_at changes
    if (lastFx === undefined) lastFx = s.fx_at || null;
    else if (s.fx_at && s.fx_at !== lastFx) { lastFx = s.fx_at; if (s.fx) playFx(s.fx); }

    cur = s;
  }

  async function boot() {
    try {
      const s = await getScoreboard();
      render(s, false);
      // reveal after first paint
      requestAnimationFrame(() => requestAnimationFrame(() => bug.classList.toggle('hidden', !s.visible)));
    } catch (e) {
      console.error('scoreboard load failed', e);
    }
    onScoreboard((s) => render(s, true));
  }
  boot();
</script>
</body>
</html>
