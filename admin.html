<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060910" />
  <title>Team Admin — Blue Steel Baseball</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=tanker@400&f[]=supreme@400,500,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    .admin-wrap { max-width: 760px; margin-inline: auto; }
    .field { display: grid; gap: 0.35rem; margin-top: 0.95rem; }
    .field label { font-family: var(--font-board); font-size: var(--text-xs); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
    .field input, .field select, .field textarea {
      font: inherit; color: var(--chalk); background: rgba(242, 240, 233, 0.05);
      border: 1px solid var(--chalk-line); padding: 0.65rem 0.8rem;
    }
    .field textarea { min-height: 5rem; resize: vertical; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    .admin-card { padding: 1.5rem; margin-top: 1.2rem; }
    .admin-list { display: grid; gap: 0.6rem; margin-top: 1rem; }
    .admin-item { display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; padding: 0.78rem 0.9rem; border: 1px solid var(--chalk-line); background: rgba(242, 240, 233, 0.02); flex-wrap: wrap; }
    .admin-item .meta { font-size: var(--text-sm); color: var(--muted); }
    .admin-item .meta strong { color: var(--chalk); }
    .mini { min-height: 2.25rem; padding: 0 0.9rem; font-size: var(--text-xs); }
    .danger { box-shadow: inset 0 0 0 1px rgba(239, 156, 139, 0.45); color: var(--loss); }
    .msg { margin-top: 0.9rem; font-size: var(--text-sm); }
    .msg.ok { color: var(--win); }
    .msg.err { color: var(--loss); }
    .score-inline { display: inline-flex; gap: 0.4rem; align-items: center; }
    .score-inline input { width: 3.4rem; text-align: center; font-family: var(--font-board); color: var(--chalk); background: rgba(242, 240, 233, 0.05); border: 1px solid var(--chalk-line); padding: 0.35rem 0.2rem; }
    .score-inline select { max-width: 7.5rem; font: inherit; color: var(--chalk); background: rgba(242, 240, 233, 0.05); border: 1px solid var(--chalk-line); padding: 0.35rem 0.3rem; }
    .checkbox { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.95rem; color: var(--muted); font-size: var(--text-sm); }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/" aria-label="Blue Steel Baseball home">
        <span class="brand-mark"><img src="/assets/logo.webp" alt="" width="80" height="80" /></span>
        <span class="brand-text"><strong>Blue Steel</strong><span>Team admin</span></span>
      </a>
      <button class="button button-secondary mini" id="logout-btn" hidden>Sign out</button>
    </div>
  </header>

  <main id="main" class="section">
    <div class="container admin-wrap">

      <!-- Login -->
      <div class="panel admin-card plate" id="login-card">
        <span class="eyebrow">Team admin</span>
        <h2 style="margin-top: 0.9rem;">Sign in</h2>
        <div class="field"><label for="login-email">Email</label><input id="login-email" type="email" autocomplete="email" /></div>
        <div class="field"><label for="login-pass">Password</label><input id="login-pass" type="password" autocomplete="current-password" /></div>
        <div class="hero-actions" style="margin-top: 1.15rem;"><button class="button button-primary" id="login-btn">Sign in</button></div>
        <p class="msg" id="login-msg"></p>
      </div>

      <!-- Dashboard -->
      <div id="dash" hidden>

        <div class="panel admin-card plate">
          <h3>Post a score</h3>
          <p class="note" style="margin-top: 0.4rem;">Most recent games first. Set the score, flip the status, save.</p>
          <div class="admin-list" id="score-list"></div>
        </div>

        <div class="panel admin-card plate">
          <h3>Add a game</h3>
          <div class="field-row">
            <div class="field"><label for="g-team">Team</label><select id="g-team"></select></div>
            <div class="field"><label for="g-date">Date &amp; time (Central)</label><input id="g-date" type="datetime-local" /></div>
          </div>
          <div class="field"><label for="g-opp">Opponent</label><input id="g-opp" placeholder="e.g. Denton Destroyers" /></div>
          <div class="field-row">
            <div class="field"><label for="g-loc">Location</label><input id="g-loc" placeholder="e.g. Porter Park, Sanger" /></div>
            <div class="field"><label for="g-tourn">Tournament (optional)</label><input id="g-tourn" /></div>
          </div>
          <div class="field"><label for="g-stream">Stream URL (optional, YouTube)</label><input id="g-stream" placeholder="https://youtube.com/live/..." /></div>
          <label class="checkbox"><input type="checkbox" id="g-home" checked /> Home game (vs) — uncheck for away (@)</label>
          <div class="hero-actions" style="margin-top: 1.15rem;"><button class="button button-primary" id="g-add">Add game</button></div>
          <p class="msg" id="g-msg"></p>
        </div>

        <div class="panel admin-card plate">
          <h3>Announcement bar</h3>
          <p class="note" style="margin-top: 0.4rem;">Shows in clay at the top of every page while active.</p>
          <div class="field"><label for="a-msg">Message</label><textarea id="a-msg" placeholder="e.g. Weather delay — first pitch pushed to 7:15 PM."></textarea></div>
          <div class="hero-actions" style="margin-top: 1rem;">
            <button class="button button-primary" id="a-post">Post &amp; activate</button>
            <button class="button button-secondary" id="a-clear">Clear active announcement</button>
          </div>
          <p class="msg" id="a-status"></p>
        </div>

        <div class="panel admin-card plate">
          <h3>Add media</h3>
          <div class="field-row">
            <div class="field"><label for="m-kind">Type</label><select id="m-kind"><option value="photo">Photo (image URL)</option><option value="video">Video (YouTube URL)</option></select></div>
            <div class="field"><label for="m-team">Team (optional)</label><select id="m-team"></select></div>
          </div>
          <div class="field"><label for="m-url">URL</label><input id="m-url" placeholder="https://..." /></div>
          <div class="field"><label for="m-cap">Caption (optional)</label><input id="m-cap" /></div>
          <div class="hero-actions" style="margin-top: 1.15rem;"><button class="button button-primary" id="m-add">Add media</button></div>
          <p class="msg" id="m-msg"></p>
          <div class="admin-list" id="media-list"></div>
        </div>

      </div>
    </div>
  </main>

  <script type="module">
    import { sb, getTeams, fmtDate, esc } from '/js/data.js';

    const $ = (id) => document.getElementById(id);
    const say = (id, text, ok = true) => { const el = $(id); el.textContent = text; el.className = `msg ${ok ? 'ok' : 'err'}`; };

    // ---------- auth ----------
    async function refreshAuth() {
      const { data: { session } } = await sb.auth.getSession();
      const authed = !!session;
      $('login-card').hidden = authed;
      $('dash').hidden = !authed;
      $('logout-btn').hidden = !authed;
      if (authed) loadDash();
    }

    $('login-btn').addEventListener('click', async () => {
      say('login-msg', 'Signing in…');
      const { error } = await sb.auth.signInWithPassword({
        email: $('login-email').value.trim(),
        password: $('login-pass').value,
      });
      if (error) return say('login-msg', error.message, false);
      refreshAuth();
    });
    $('login-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('login-btn').click(); });
    $('logout-btn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

    // ---------- dashboard ----------
    let teams = [];

    async function loadDash() {
      try {
        teams = await getTeams();
      } catch (e) {
        return say('g-msg', `Could not load teams: ${e.message}`, false);
      }
      const opts = teams.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
      $('g-team').innerHTML = opts;
      $('m-team').innerHTML = `<option value="">—</option>` + opts;
      loadScores();
      loadAnnouncement();
      loadMedia();
    }

    async function loadScores() {
      const { data, error } = await sb.from('games')
        .select('*, teams(name)')
        .order('game_date', { ascending: false })
        .limit(12);
      if (error) return;
      $('score-list').innerHTML = (data ?? []).map(g => `
        <div class="admin-item" data-id="${g.id}">
          <div class="meta"><strong>${esc(g.teams.name)} ${g.is_home ? 'vs' : '@'} ${esc(g.opponent)}</strong><br>${fmtDate(g.game_date)}</div>
          <div class="score-inline">
            <input type="number" min="0" class="us" value="${g.our_score ?? ''}" placeholder="Us" aria-label="Our score" />
            <span>–</span>
            <input type="number" min="0" class="them" value="${g.their_score ?? ''}" placeholder="Them" aria-label="Their score" />
            <select class="status" aria-label="Status">
              ${['scheduled','live','final','cancelled'].map(s => `<option ${s === g.status ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
            <button class="button button-secondary mini save">Save</button>
            <button class="button button-secondary mini danger del">✕</button>
          </div>
        </div>`).join('');

      $('score-list').querySelectorAll('.admin-item').forEach(item => {
        item.querySelector('.save').addEventListener('click', async () => {
          const us = item.querySelector('.us').value;
          const them = item.querySelector('.them').value;
          const { error } = await sb.from('games').update({
            our_score: us === '' ? null : Number(us),
            their_score: them === '' ? null : Number(them),
            status: item.querySelector('.status').value,
          }).eq('id', item.dataset.id);
          item.querySelector('.save').textContent = error ? 'Error' : 'Saved ✓';
          setTimeout(() => { item.querySelector('.save').textContent = 'Save'; }, 1800);
        });
        item.querySelector('.del').addEventListener('click', async () => {
          if (!confirm('Delete this game? This can\'t be undone.')) return;
          const { error } = await sb.from('games').delete().eq('id', item.dataset.id);
          if (!error) item.remove();
        });
      });
    }

    $('g-add').addEventListener('click', async () => {
      if (!$('g-opp').value.trim() || !$('g-date').value) return say('g-msg', 'Opponent and date are required.', false);
      const { error } = await sb.from('games').insert({
        team_id: $('g-team').value,
        opponent: $('g-opp').value.trim(),
        game_date: new Date($('g-date').value).toISOString(),
        location: $('g-loc').value.trim() || null,
        tournament: $('g-tourn').value.trim() || null,
        stream_url: $('g-stream').value.trim() || null,
        is_home: $('g-home').checked,
      });
      if (error) return say('g-msg', error.message, false);
      say('g-msg', 'Game added ✓');
      ['g-opp','g-loc','g-tourn','g-stream','g-date'].forEach(id => $(id).value = '');
      loadScores();
    });

    // ---------- announcements ----------
    async function loadAnnouncement() {
      const { data } = await sb.from('announcements').select('*').eq('is_active', true).order('created_at', { ascending: false }).limit(1);
      $('a-status').textContent = data?.[0] ? `Active now: "${data[0].message}"` : 'No active announcement.';
      $('a-status').className = 'msg';
    }
    $('a-post').addEventListener('click', async () => {
      const message = $('a-msg').value.trim();
      if (!message) return say('a-status', 'Write a message first.', false);
      const off = await sb.from('announcements').update({ is_active: false }).eq('is_active', true);
      if (off.error) return say('a-status', off.error.message, false);
      const { error } = await sb.from('announcements').insert({ message, is_active: true });
      if (error) return say('a-status', error.message, false);
      $('a-msg').value = '';
      loadAnnouncement();
    });
    $('a-clear').addEventListener('click', async () => {
      const { error } = await sb.from('announcements').update({ is_active: false }).eq('is_active', true);
      if (error) return say('a-status', error.message, false);
      loadAnnouncement();
    });

    // ---------- media ----------
    async function loadMedia() {
      const { data } = await sb.from('media').select('*, teams(name)').order('created_at', { ascending: false }).limit(10);
      $('media-list').innerHTML = (data ?? []).map(m => `
        <div class="admin-item" data-id="${m.id}">
          <div class="meta"><strong>${m.kind}</strong> ${esc(m.caption ?? m.url.slice(0, 44) + '…')}</div>
          <button class="button button-secondary mini danger del">✕</button>
        </div>`).join('');
      $('media-list').querySelectorAll('.admin-item').forEach(item => {
        item.querySelector('.del').addEventListener('click', async () => {
          if (!confirm('Remove this from the site?')) return;
          const { error } = await sb.from('media').delete().eq('id', item.dataset.id);
          if (!error) item.remove();
        });
      });
    }
    $('m-add').addEventListener('click', async () => {
      const url = $('m-url').value.trim();
      if (!url) return say('m-msg', 'A URL is required.', false);
      const { error } = await sb.from('media').insert({
        kind: $('m-kind').value,
        url,
        caption: $('m-cap').value.trim() || null,
        team_id: $('m-team').value || null,
      });
      if (error) return say('m-msg', error.message, false);
      say('m-msg', 'Added ✓');
      $('m-url').value = ''; $('m-cap').value = '';
      loadMedia();
    });

    refreshAuth();
  </script>
</body>
</html>
